name: Build TouchController for Amethyst iOS

on: [ pull_request, push, workflow_dispatch ]

jobs:
  debug_unified:
    name: Debug unified build (temporary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      - name: Build unified target
        run: |
          set -o pipefail
          bazel build --verbose_failures --config=opt //touchcontroller 2>&1 | tee /tmp/build.log || {
            echo '### Bazel failure tail' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -c 10000 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  build_mod:
    name: Build Fabric 1.21.11 mod
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      # Building on macOS also bundles the iOS transport dylib into the JAR,
      # so this build can be used with Amethyst iOS directly.
      - name: Build
        run: bazel build --verbose_failures --config=opt --jobs=4 //touchcontroller/versions/fabric/1.21.11

      - name: Upload mod artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller-fabric-1.21.11-ios
          path: bazel-bin/touchcontroller/versions/fabric/1.21.11/fabric.jar

  build_ios_framework:
    name: Build iOS XCFramework and dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      # The XCFramework is for launchers that statically link TouchController's
      # transport into the app (the recommended integration for Amethyst iOS).
      - name: Build XCFramework
        run: bazel build --verbose_failures --config=opt //touchcontroller/proxy/server/ios:ios_framework

      # A standalone dylib, for launchers that prefer loading the transport at runtime.
      - name: Build dylib
        run: >
          bazel build --verbose_failures --config=opt
          --platforms=@//platforms:ios_arm64
          //touchcontroller/proxy/server/ios:proxy_server_ios

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller_proxy.xcframework.zip
          path: bazel-bin/touchcontroller/proxy/server/ios/ios_framework.xcframework.zip

      - name: Upload dylib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller_proxy-ios-dylib
          path: bazel-bin/touchcontroller/proxy/server/ios/proxy_server_ios_ios_aarch64/libproxy_server_ios.dylib

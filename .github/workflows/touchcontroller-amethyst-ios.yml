name: Build TouchController for Amethyst iOS

on: [ pull_request, push, workflow_dispatch ]

jobs:
  build_mod:
    name: Build Fabric 1.21.11 mod
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      # Some pinned artifacts (e.g. Fabric 1.21.1) were re-published upstream with
      # different bytes, which breaks checksum validation on fresh builds. Re-pin
      # them the sanctioned way and push the regenerated lock file.
      - name: Repin stale maven artifacts
        run: |
          REPIN=1 bazel run @maven_fabric_1_21_1//:pin

      - name: Push repinned lock file
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pin changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[build] Repin Fabric 1.21.1 maven artifacts [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      # The shippable Fabric JAR (all versions, dependencies JAR-in-JAR).
      # Building on macOS also bundles the iOS transport dylib into the JAR,
      # so this build can be used with Amethyst iOS directly.
      - name: Build
        run: bazel build --verbose_failures --config=opt --jobs=4 //touchcontroller/fabric

      - name: Upload mod artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller-fabric-ios
          if-no-files-found: error
          path: bazel-bin/touchcontroller/fabric/fabric.jar

  build_ios_framework:
    name: Build iOS XCFramework and dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          repository-cache: MODULE.bazel.lock

      - name: Setup Bazel Mirror
        uses: ./.github/actions/setup-bazel-cache
        with:
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}

      # The XCFramework is for launchers that statically link TouchController's
      # transport into the app (the recommended integration for Amethyst iOS).
      - name: Build XCFramework
        run: bazel build --verbose_failures --config=opt //touchcontroller/proxy/server/ios:ios_framework

      # A standalone dylib, for launchers that prefer loading the transport at runtime.
      - name: Build dylib
        run: >
          bazel build --verbose_failures --config=opt
          --platforms=@//platforms:ios_arm64
          //touchcontroller/proxy/server/ios:proxy_server_ios

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller_proxy.xcframework.zip
          path: bazel-bin/touchcontroller/proxy/server/ios/ios_framework.xcframework.zip

      - name: Upload dylib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: touchcontroller_proxy-ios-dylib
          path: bazel-bin/touchcontroller/proxy/server/ios/proxy_server_ios_ios_aarch64/libproxy_server_ios.dylib
